# 3-year, 9-term programme timeline for a UK Scout Troop (ages 10-14).
# Each term is a 12-week framework with a 6-7 week core badge content block,
# so completion fits within a single term even during shortened school terms.

# NOTE: Year 1, Term 2's original content ("Global Citizens & Conservation" --
# Global Issues Challenge Award + Environmental Conservation Activity Badge) was
# displaced when the World Challenge Award moved into Term 1, and later when
# Term 2 itself became the Emergency Aid term. It hasn't been re-slotted
# anywhere yet -- TBD.
#
# NOTE: Year 1, Term 3's original content ("Pioneering & Outdoor Survival" --
# Pioneer Activity Badge + Paddle Sports Activity Badge, plus Adventure Challenge
# Award which is now earned passively anyway) was displaced when Term 3 became
# the Fire & Cooking / Chef Activity Badge term.
#
# RESOLVED: Pioneer Activity Badge and Paddle Sports Activity Badge, left TBD
# above, have now been re-slotted into Year 2, Term 2 and Year 2, Term 3
# respectively (see below). Pioneer Activity Badge's knot-tying content is now
# the home for the Outdoor Challenge Award's pioneering-gadget requirement (see
# filler-sessions/outdoor-challenge-award/README.md, requirement 7).
#
# RESOLVED: Outdoor Challenge Award, Adventure Challenge Award, and Teamwork
# Challenge Award are never a dedicated focus-badge term -- the group decided
# to earn all three passively, accumulated across many terms via the standing
# Welcome/Night Hike/Camp/External Activity slots every term already has, plus
# standalone sessions in filler-sessions/ (see filler-sessions/README.md and
# filler-sessions/outdoor-challenge-award/README.md). This is a deliberate,
# settled decision, not something left open.
#
# REMOVED (pending replan): Year 3's three terms used to appear below, but
# they were pre-redesign leftovers from the original Google Doc import and
# had never actually been revisited -- Term 2 still listed "Teamwork
# Challenge Award" as a dedicated term badge despite that award being made
# permanently passive (see RESOLVED note above), and Term 1 duplicated Chef
# Activity Badge and Emergency Aid Staged Activity Badge (Stage 3/4) from
# Year 1 without that being a deliberate decision. Rather than keep stale,
# known-wrong placeholder data in the timeline, Year 3 has been removed
# entirely from this file. It'll be added back only once it's actually
# replanned, the same way Year 1 and Year 2 were -- see data/awards.yaml
# for what happened to the badges that only had a home in the old Year 3
# (Skills Challenge Award, Personal Challenge Award, Communicator Activity
# Badge, Master at Arms Activity Badge).
#
# Year 1, Term 2 and Term 3, and all of Year 2, below are framework-only so far
# (theme, core goals, badge) -- no year-<N>/term-<N>/ session files have been
# built out yet for any of them.
#
# NOTE: Year 2's original content was displaced when Term 1 became Creative
# Challenge Award, Term 2 became Pioneer Activity Badge, and Term 3 became
# Paddle Sports. Displaced and not yet re-slotted: Team Leader Challenge Award
# and Navigator Staged Activity Badge (Stage 3/4) from the old Term 1;
# Scientist Activity Badge or Artist Activity Badge from the old Term 2
# (Creative Challenge Award itself just relocated from Term 2 to Term 1, so
# it isn't displaced); Expedition Challenge Award and Hiker Activity Badge
# from the old Term 3. Also corrected: "Paddle Sports Activity Badge" doesn't
# exist as a flat activity badge -- it's the "Paddle Sports Staged Activity
# Badge" (Stages 1-4+), same pattern as Emergency Aid/Navigator.
#
# PIVOT: the programme moved from a 4-year, 12-term plan to a 3-year, 9-term
# plan. Year 4 (Terms 10-12) is removed outright, not re-slotted -- it was
# never built out beyond this summary level, so there are no session files
# to migrate. Its badges are dropped from the programme entirely (see the
# dropped-badges note at the top of data/awards.yaml): Survival Skills
# Activity Badge; Global Issues Challenge Award (Cycle 2/Refresher) and
# Photographer Activity Badge; Expedition Challenge Award (Cycle 2/Senior
# Roles) and Campers Activity Badge. The Chief Scout's Gold Award (the top
# award) is no longer tied to a specific term either -- it's presented to
# each Scout individually as they complete the required Challenge Awards and
# personal milestones, whenever that happens to fall, rather than at a
# single end-of-programme ceremony.

terms:
  - year: 1
    term: 1
    season: Autumn
    theme: "Community & Global Citizenship"
    core_goals: >-
      Local community research, personal and societal beliefs and attitudes,
      environmental action, and connecting with the wider Scout movement.
    badges_earned:
      - "World Challenge Award"
    optional_progression:
      - "Nights Away (2)"
      - "Hikes Away (1)"

  - year: 1
    term: 2
    season: Spring
    theme: "First Aid & Emergency Response"
    core_goals: >-
      Calling 999, and how to help someone who is unconscious, unconscious and
      not breathing, bleeding, choking, or having a burn, heat exhaustion,
      hypothermia, or an asthma attack.
    badges_earned:
      - "Emergency Aid Staged Activity Badge (Stage 3)"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 1
    term: 3
    season: Summer
    theme: "Fire & Cooking"
    core_goals: >-
      Menu planning, shopping and food storage, cooking and serving a
      two-course meal, and safe clear-up and waste management.
    badges_earned:
      - "Chef Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Time on the Water"

  - year: 2
    term: 1
    season: Autumn
    theme: "Creative Challenge"
    core_goals: >-
      Trying out four or more creative activities over time, developing a
      real skill in one of them, building a model from a kit or recycled
      materials, using social media/the internet creatively and safely, and
      taking part in a performance.
    badges_earned:
      - "Creative Challenge Award"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 2
    term: 2
    season: Spring
    theme: "Knots & Pioneering"
    core_goals: >-
      A group indoor and outdoor pioneering project, whipping and sealing
      rope ends, splicing, coiling and storing rope, using levers, pioneering
      safety, and naming and tying six or more knots and three or more
      lashings.
    badges_earned:
      - "Pioneer Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 2
    term: 3
    season: Summer
    theme: "On the Water"
    core_goals: >-
      Identifying different paddle craft, naming safe local canoeing/kayaking
      locations, a warm-up activity, dressing appropriately with a buoyancy
      aid, and a taster session covering equipment, getting in and out
      safely, balancing, and manoeuvring.
    badges_earned:
      - "Paddle Sports Staged Activity Badge (Stage 1)"
    optional_progression:
      - "Nights Away (+2)"
      - "Time on the Water"
