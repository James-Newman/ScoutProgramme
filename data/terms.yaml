# 4-year, 12-term programme timeline for a UK Scout Troop (ages 10-14).
# Each term is a 12-week framework with a 6-7 week core badge content block,
# so completion fits within a single term even during shortened school terms.

# NOTE: Year 1, Term 2's original content ("Global Citizens & Conservation" --
# Global Issues Challenge Award + Environmental Conservation Activity Badge) was
# displaced when the World Challenge Award moved into Term 1, and later when
# Term 2 itself became the Emergency Aid term. It hasn't been re-slotted
# anywhere yet -- TBD.
#
# NOTE: Year 1, Term 3's original content ("Pioneering & Outdoor Survival" --
# Pioneer Activity Badge + Paddle Sports Activity Badge, plus Adventure Challenge
# Award which is now earned passively anyway) was displaced when Term 3 became
# the Fire & Cooking / Chef Activity Badge term. Pioneer Activity Badge and
# Paddle Sports Activity Badge haven't been re-slotted anywhere yet -- TBD. Note
# that Pioneer Activity Badge's knot-tying content would have been a natural home
# for the Outdoor Challenge Award's pioneering-gadget requirement (see
# filler-sessions/outdoor-challenge-award/README.md) -- worth keeping in mind
# when re-slotting it.
#
# RESOLVED: Outdoor Challenge Award, Adventure Challenge Award, and Teamwork
# Challenge Award are never a dedicated focus-badge term -- the group decided
# to earn all three passively, accumulated across many terms via the standing
# Welcome/Night Hike/Camp/External Activity slots every term already has, plus
# standalone sessions in filler-sessions/ (see filler-sessions/README.md and
# filler-sessions/outdoor-challenge-award/README.md). This is a deliberate,
# settled decision, not something left open.
#
# STILL OUTSTANDING (not yet touched -- only Year 1 has been revisited so far):
# Year 3, Term 2 below still lists "Teamwork Challenge Award" as a dedicated
# term badge, from before this redesign. Needs a new focus badge whenever
# Year 3 gets built out -- don't treat that entry as current.
#
# Year 1, Term 2 and Term 3 below are framework-only so far (theme, core goals,
# badge) -- no year-<N>/term-<N>/ session files have been built out yet.

terms:
  - year: 1
    term: 1
    season: Autumn
    theme: "Community & Global Citizenship"
    core_goals: >-
      Local community research, personal and societal beliefs and attitudes,
      environmental action, and connecting with the wider Scout movement.
    badges_earned:
      - "World Challenge Award"
    optional_progression:
      - "Nights Away (2)"
      - "Hikes Away (1)"

  - year: 1
    term: 2
    season: Spring
    theme: "First Aid & Emergency Response"
    core_goals: >-
      Calling 999, and how to help someone who is unconscious, unconscious and
      not breathing, bleeding, choking, or having a burn, heat exhaustion,
      hypothermia, or an asthma attack.
    badges_earned:
      - "Emergency Aid Staged Activity Badge (Stage 3)"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 1
    term: 3
    season: Summer
    theme: "Fire & Cooking"
    core_goals: >-
      Menu planning, shopping and food storage, cooking and serving a
      two-course meal, and safe clear-up and waste management.
    badges_earned:
      - "Chef Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Time on the Water"

  - year: 2
    term: 1
    season: Autumn
    theme: "Navigation & Patrol Leadership"
    core_goals: >-
      Map reading, compass work, using OS maps on the night hike, and
      introducing older Scouts to leading smaller tasks.
    badges_earned:
      - "Team Leader Challenge Award"
      - "Navigator Staged Activity Badge (Stage 3/4)"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 2
    term: 2
    season: Spring
    theme: "Creative Makers & Communicators"
    core_goals: >-
      Problem-solving, building gadgets, simple science experiments, and
      theatrical/creative communication challenges.
    badges_earned:
      - "Creative Challenge Award"
      - "Scientist Activity Badge or Artist Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 2
    term: 3
    season: Summer
    theme: "The Lightweight Expedition"
    core_goals: >-
      Planning routes, packing rucksacks, country code, and executing a
      lightweight hike-and-camp weekend.
    badges_earned:
      - "Expedition Challenge Award"
      - "Hiker Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+2)"
      - "Time on the Water"

  - year: 3
    term: 1
    season: Autumn
    theme: "Practical Skills & Self-Reliance"
    core_goals: >-
      First aid scenarios, emergency response, basic DIY/repairs, and
      cooking on open stoves.
    badges_earned:
      - "Skills Challenge Award"
      - "Chef Activity Badge"
      - "Emergency Aid Staged Activity Badge (Stage 3/4)"
    optional_progression:
      - "Ongoing Nights & Hikes Away"

  - year: 3
    term: 2
    season: Spring
    theme: "Teamwork & Problem Solving"
    core_goals: >-
      Cooperative team games, non-verbal communication challenges, and
      patrol-led mini-projects.
    badges_earned:
      - "Teamwork Challenge Award"
      - "Communicator Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 3
    term: 3
    season: Summer
    theme: "Target Sports & Personal Challenge"
    core_goals: >-
      Air rifle and pistol marksmanship, range safety discipline, personal
      scoring targets, and individual challenge goal-setting.
    badges_earned:
      - "Personal Challenge Award"
      - "Master at Arms Activity Badge (Air Rifle / Pistol Shooting)"
    optional_progression:
      - "Nights Away (+2)"
      - "Time on the Water"

  - year: 4
    term: 1
    season: Autumn
    theme: "Advanced Bushcraft & Wilderness"
    core_goals: >-
      Natural shelter building, foraging awareness, advanced firecraft, and
      outdoor survival consolidation.
    badges_earned:
      - "Survival Skills Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 4
    term: 2
    season: Spring
    theme: "World Cultures & Digital Media"
    core_goals: >-
      International Scouting customs, photography during hikes, and creating
      digital content for the troop.
    badges_earned:
      - "Global Issues Challenge Award (Cycle 2 / Refresher)"
      - "Photographer Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 4
    term: 3
    season: Summer
    theme: "Expedition Leadership & Gold Celebration"
    core_goals: >-
      Older Scouts take leadership roles on the weekend expedition; final
      sign-offs for departing Scouts.
    badges_earned:
      - "Expedition Challenge Award (Cycle 2 / Senior Roles)"
      - "Campers Activity Badge"
      - "Chief Scout's Gold Award (Sign-off & Presentation)"
    optional_progression:
      - "Final Stage Sign-offs"
      - "Time on the Water"
