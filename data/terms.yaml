# 3-year, 9-term programme timeline for a UK Scout Troop (ages 10-14).
# Each term is a 12-week framework with a 6-7 week core badge content block,
# so completion fits within a single term even during shortened school terms.

# NOTE: Year 1, Term 2's original content ("Global Citizens & Conservation" --
# Global Issues Challenge Award + Environmental Conservation Activity Badge) was
# displaced when the World Challenge Award moved into Term 1, and later when
# Term 2 itself became the Emergency Aid term.
#
# RESOLVED: "Global Issues Challenge Award" turned out to be a naming error --
# it isn't a real Scout Association Challenge Award (there are only 9 for the
# Scouts section: Adventure, World, Creative, Expedition, Outdoor, Personal,
# Skills, Team Leader, Teamwork). It was most likely always meant to be the
# real "Global Issues Activity Badge" instead, now correctly named and
# re-slotted into Year 2, Term 3 (see below). Environmental Conservation
# Activity Badge is now resolved too, into Year 3, Term 3 (see below).
#
# NOTE: Year 1, Term 3's original content ("Pioneering & Outdoor Survival" --
# Pioneer Activity Badge + Paddle Sports Activity Badge, plus Adventure Challenge
# Award which is now earned passively anyway) was displaced when Term 3 became
# the Fire & Cooking / Chef Activity Badge term.
#
# RESOLVED: Pioneer Activity Badge and Paddle Sports Activity Badge, left TBD
# above, have now been re-slotted into Year 2, Term 2 and Year 2, Term 3
# respectively (see below). Pioneer Activity Badge's knot-tying content is now
# the home for the Outdoor Challenge Award's pioneering-gadget requirement (see
# filler-sessions/outdoor-challenge-award/README.md, requirement 7).
#
# RESOLVED: Outdoor Challenge Award, Adventure Challenge Award, and Teamwork
# Challenge Award are never a dedicated focus-badge term -- the group decided
# to earn all three passively, accumulated across many terms via the standing
# Welcome/Night Hike/Camp/External Activity slots every term already has, plus
# standalone sessions in filler-sessions/ (see filler-sessions/README.md and
# filler-sessions/outdoor-challenge-award/README.md). This is a deliberate,
# settled decision, not something left open.
#
# RESOLVED: Team Leader Challenge Award, Personal Challenge Award, and
# Expedition Challenge Award (all previously displaced/TBD) are now also
# passive, alongside Outdoor/Adventure/Teamwork above -- but each in its own
# way rather than via a filler-sessions/ file. See data/awards.yaml for how
# each is actually covered: termly leader review for Team Leader and
# Personal; the standing summer Camp plus the autumn Grimsdyke Challenge
# Hike for Expedition.
#
# Year 3's three terms used to appear below as pre-redesign leftovers from
# the original Google Doc import that had never actually been revisited --
# Term 2 listed "Teamwork Challenge Award" as a dedicated term badge despite
# that award being made permanently passive, and Term 1 duplicated Chef
# Activity Badge and Emergency Aid Staged Activity Badge (Stage 3/4) from
# Year 1. All three were removed entirely rather than kept as stale,
# known-wrong placeholder data.
#
# RESOLVED: Year 3, Term 1 has now been re-added below with Skills Challenge
# Award as its focus badge -- fitting back into its original slot from the
# old pre-redesign plan, now properly verified against the real badge
# requirements. Of the badges that only had a home in the old, removed
# Year 3 data, Personal Challenge Award and Master at Arms Activity Badge
# are now covered passively elsewhere, and Communicator Activity Badge is
# now a complete-in-one-sitting filler session instead (see
# data/awards.yaml and filler-sessions/README.md) -- all resolved.
#
# RESOLVED: Year 3, Terms 2 and 3 have now been re-added below too, with
# Scientist Activity Badge and Environmental Conservation Activity Badge
# respectively -- resolving two more long-standing displacement flags
# (see below). Navigator Staged Activity Badge (Stage 3/4), Hiker Activity
# Badge, and Communicator Activity Badge remain displaced/TBD -- see
# data/awards.yaml.
#
# Year 1, Term 2 and Term 3, and all of Year 2 and Year 3, below are
# framework-only so far (theme, core goals, badge) -- no year-<N>/term-<N>/
# session files have been built out yet for any of them.
#
# NOTE: Year 2's original content was displaced when Term 1 became Creative
# Challenge Award, Term 2 became Pioneer Activity Badge, and Term 3 became
# Paddle Sports. Navigator Staged Activity Badge (Stage 3/4) from the old
# Term 1 (Team Leader Challenge Award from that same term is now resolved
# to passive, see above) is now resolved to passive too (see below).
# Scientist Activity Badge from the old Term 2 (Creative Challenge Award
# itself just relocated from Term 2 to Term 1, so it isn't displaced) is
# now resolved into Year 3, Term 2 above. Hiker
# Activity Badge from the old Term 3 (Expedition Challenge Award from that
# same term is now resolved to passive, see above) turned out to be a
# naming error and has been dropped entirely -- see the DROPPED note at the
# top of data/awards.yaml. Also corrected: "Paddle Sports Activity Badge"
# doesn't exist as a flat activity badge -- it's the "Paddle Sports Staged
# Activity Badge" (Stages 1-4+), same pattern as Emergency Aid/Navigator.
#
# PIVOT: the programme moved from a 4-year, 12-term plan to a 3-year, 9-term
# plan. Year 4 (Terms 10-12) is removed outright, not re-slotted -- it was
# never built out beyond this summary level, so there are no session files
# to migrate. Its badges are dropped from the programme entirely (see the
# dropped-badges note at the top of data/awards.yaml): Survival Skills
# Activity Badge; Global Issues Challenge Award (Cycle 2/Refresher) and
# Photographer Activity Badge; Expedition Challenge Award (Cycle 2/Senior
# Roles) and Campers Activity Badge. The Chief Scout's Gold Award (the top
# award) is no longer tied to a specific term either -- it's presented to
# each Scout individually as they complete the required Challenge Awards and
# personal milestones, whenever that happens to fall, rather than at a
# single end-of-programme ceremony.
#
# RESOLVED: Year 2, Term 3 ("On the Water" -- Paddle Sports Staged Activity
# Badge, Stage 1) was vacated when Paddle Sports moved to passive -- see
# filler-sessions/paddle-sports-staged-activity-badge.md and the MOVED TO
# PASSIVE note at the top of data/awards.yaml. It has now been re-slotted
# below with Global Issues Activity Badge (see the first NOTE above) --
# there was no real 9th/10th Challenge Award left over to fill it once Team
# Leader, Expedition, Personal, and Master at Arms all moved to passive
# treatment, so it's an Activity Badge rather than a Challenge Award, unlike
# Year 1 Term 1 and Year 2 Term 1's Challenge-Award terms.

terms:
  - year: 1
    term: 1
    season: Autumn
    theme: "Community & Global Citizenship"
    core_goals: >-
      Local community research, personal and societal beliefs and attitudes,
      environmental action, and connecting with the wider Scout movement.
    badges_earned:
      - "World Challenge Award"
    optional_progression:
      - "Nights Away (2)"
      - "Hikes Away (1)"

  - year: 1
    term: 2
    season: Spring
    theme: "First Aid & Emergency Response"
    core_goals: >-
      Calling 999, and how to help someone who is unconscious, unconscious and
      not breathing, bleeding, choking, or having a burn, heat exhaustion,
      hypothermia, or an asthma attack.
    badges_earned:
      - "Emergency Aid Staged Activity Badge (Stage 3)"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 1
    term: 3
    season: Summer
    theme: "Fire & Cooking"
    core_goals: >-
      Menu planning, shopping and food storage, cooking and serving a
      two-course meal, and safe clear-up and waste management.
    badges_earned:
      - "Chef Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Time on the Water"

  - year: 2
    term: 1
    season: Autumn
    theme: "Creative Challenge"
    core_goals: >-
      Trying out four or more creative activities over time, developing a
      real skill in one of them, building a model from a kit or recycled
      materials, using social media/the internet creatively and safely, and
      taking part in a performance.
    badges_earned:
      - "Creative Challenge Award"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 2
    term: 2
    season: Spring
    theme: "Knots & Pioneering"
    core_goals: >-
      A group indoor and outdoor pioneering project, whipping and sealing
      rope ends, splicing, coiling and storing rope, using levers, pioneering
      safety, and naming and tying six or more knots and three or more
      lashings.
    badges_earned:
      - "Pioneer Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 2
    term: 3
    season: Summer
    theme: "Global Issues"
    core_goals: >-
      Tracing where clothing and belongings are made, researching a recent
      natural disaster and how the Troop could help, exploring how an
      international sporting event contributes to peace and understanding,
      sharing an international health issue creatively, and comparing rights
      in the UK with those of a Scout in another country.
    badges_earned:
      - "Global Issues Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Time on the Water"

  - year: 3
    term: 1
    season: Autumn
    theme: "Skills & Self-Reliance"
    core_goals: >-
      Regular physical activity over four to six weeks with a progress
      record, researching the risks of smoking/alcohol/drugs alongside diet,
      hydration, and sleep, learning and practising a practical life skill,
      and taking part in problem-solving activities.
    badges_earned:
      - "Skills Challenge Award"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 3
    term: 2
    season: Spring
    theme: "Scouting Science"
    core_goals: >-
      Planning and running three science experiments tied to camping and the
      outdoors, changing one variable and predicting/checking the outcome
      each time, and explaining how one experiment links to the real world.
    badges_earned:
      - "Scientist Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Hikes Away (+1)"

  - year: 3
    term: 3
    season: Summer
    theme: "Environmental Conservation"
    core_goals: >-
      Researching an environmental issue important to the local community,
      taking part in an activity or project that improves local conservation,
      and running a campaign to raise awareness of an environmental issue.
    badges_earned:
      - "Environmental Conservation Activity Badge"
    optional_progression:
      - "Nights Away (+2)"
      - "Time on the Water"
