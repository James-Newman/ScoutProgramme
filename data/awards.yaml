# Full award catalogue for the 3-year, 9-term programme.
# A Scout who consistently attends and participates in regular weekly
# meetings over the 9-term journey achieves this full set of awards.
#
# PIVOT: the programme moved from a 4-year, 12-term plan to 3-year, 9-term.
# Year 4 badges are dropped entirely, not re-slotted (see data/terms.yaml):
# Survival Skills Activity Badge; Photographer Activity Badge; Campers
# Activity Badge; the Global Issues Challenge Award and Expedition Challenge
# Award Cycle 2 refreshers that were tied to Year 4. They're removed from
# this catalogue rather than left as "TBD, not yet re-slotted", since
# there's no plan to bring them back into a 3-year programme.
#
# REMOVED (pending replan): Year 3's three terms were pre-redesign leftovers
# and have been removed from data/terms.yaml entirely rather than kept as
# stale placeholders (see the note there). Badges that only had a home in
# that stale data are flagged "TBD — pending Year 3 replan" below rather
# than tied to a specific old term number: Skills Challenge Award, Personal
# Challenge Award, Communicator Activity Badge, Master at Arms Activity
# Badge. Unlike the Year 4 drop above, these aren't being removed from the
# programme -- Year 3 still exists conceptually, it just hasn't been
# replanned yet.

top_award:
  name: "Chief Scout's Gold Award"
  earned: "Passive — not tied to any specific term"
  notes: >-
    Presented to each Scout individually as they complete all required
    Challenge Awards and personal milestones, whenever that happens to
    fall, rather than at a single end-of-programme ceremony. Previously
    tied to the end of Year 4, Term 3, before Year 4 was dropped.

challenge_awards:
  - name: "World Challenge Award"
    earned:
      - "Year 1, Term 1"
    notes: >-
      All 7 requirements are covered in Year 1, Term 1 (see
      year-1/term-1/) across just 4 of the term's 7 core-content
      sessions — reqs 3+4 (beliefs/attitudes/values) and reqs 6+7
      (international issues/connections) each combine into one
      session, and reqs 2+5 (a volunteering day, an environmental
      project) combine into one non-standard "day" session at an
      environmental-linked local service. The 3 freed sessions carry
      filler-session badges (World Faiths, Local Knowledge,
      Naturalist) instead of new World Challenge Award content.
  - name: "Outdoor Challenge Award"
    earned:
      - "Passive — not tied to any specific term"
    notes: >-
      Never a dedicated focus-badge term. Earned across many terms via
      filler-sessions/outdoor-challenge-award/ (skill-teaching sessions
      slotted in wherever a term has room) plus the standing Camp/Night
      Hike/Welcome/External Activity guidance documented in AGENTS.md.
      See filler-sessions/outdoor-challenge-award/README.md for the
      full requirement map. Nights Away specifically is an explicitly
      cumulative requirement (at least eight nights away, four camping)
      that crosses the threshold around Year 2, Term 1 regardless.
  - name: "Global Issues Challenge Award"
    earned:
      - "TBD — displaced from Year 1, Term 2 when the World Challenge Award and Outdoor Challenge Award moved terms; not yet re-slotted (see data/terms.yaml)"
    notes: >-
      Its Cycle 2 refresher was previously planned for Year 4, Term 2;
      dropped along with the rest of Year 4 when the programme moved to
      3 years (see data/terms.yaml).
  - name: "Adventure Challenge Award"
    earned:
      - "Passive — not tied to any specific term"
    notes: >-
      Never a dedicated focus-badge term. The "four different adventurous
      activities" requirement accumulates via every term's standing
      External Activity slot; the reflective requirements are delivered
      by filler-sessions/adventure-challenge-award.md whenever a Scout
      has enough External Activities behind them. Previously assigned to
      Year 1, Term 3 ("Pioneering & Outdoor Survival") before that term
      became the Chef Activity Badge term — see the note in
      data/terms.yaml.
  - name: "Team Leader Challenge Award"
    earned:
      - "TBD — displaced from Year 2, Term 1 when that term became the Creative Challenge Award term; not yet re-slotted (see data/terms.yaml)"
  - name: "Creative Challenge Award"
    earned:
      - "Year 2, Term 1"
    notes: >-
      Moved here from Year 2, Term 2 when Term 1 became the Creative
      Challenge Award term and Term 2 became Pioneer Activity Badge instead
      — see data/terms.yaml.
  - name: "Expedition Challenge Award"
    earned:
      - "TBD — displaced from Year 2, Term 3 when that term became Paddle Sports Staged Activity Badge (Stage 1); not yet re-slotted (see data/terms.yaml)"
    notes: >-
      Its Cycle 2 / senior-roles refresher was previously planned for
      Year 4, Term 3; dropped along with the rest of Year 4 when the
      programme moved to 3 years (see data/terms.yaml).
  - name: "Skills Challenge Award"
    earned:
      - "TBD — pending Year 3 replan; previously Year 3, Term 1, removed along with the rest of Year 3's stale pre-redesign data (see data/terms.yaml)"
  - name: "Teamwork Challenge Award"
    earned:
      - "Passive — not tied to any specific term"
    notes: >-
      Never a dedicated focus-badge term. Three of its four requirements
      accumulate via every term's standing Welcome Session (regular
      patrol activities, a varied icebreaker, and the "agree own rules"
      block counting as a Patrol/Troop Forum); the reflective requirement
      is delivered by filler-sessions/teamwork-challenge-award.md.
  - name: "Personal Challenge Award"
    earned:
      - "TBD — pending Year 3 replan; previously Year 3, Term 3, removed along with the rest of Year 3's stale pre-redesign data (see data/terms.yaml)"

activity_badges:
  - name: "Environmental Conservation Activity Badge"
    earned: "TBD — displaced from Year 1, Term 2; not yet re-slotted (see data/terms.yaml)"
  - name: "Pioneer Activity Badge"
    earned: "Year 2, Term 2"
    notes: >-
      Displaced from Year 1, Term 3 when that term became the Chef Activity
      Badge term; now resolved in Year 2, Term 2. Its knot-tying/pioneering-
      safety content is the natural home for the Outdoor Challenge Award's
      pioneering-gadget requirement (requirement 7) — see
      filler-sessions/outdoor-challenge-award/README.md.
  - name: "Scientist Activity Badge or Artist Activity Badge"
    earned: "TBD — displaced from Year 2, Term 2 when that term became the Pioneer Activity Badge term; not yet re-slotted (see data/terms.yaml)"
  - name: "Hiker Activity Badge"
    earned: "TBD — displaced from Year 2, Term 3 when that term became Paddle Sports Staged Activity Badge (Stage 1); not yet re-slotted (see data/terms.yaml)"
  - name: "Chef Activity Badge"
    earned: "Year 1, Term 3"
  - name: "Communicator Activity Badge"
    earned: "TBD — pending Year 3 replan; previously Year 3, Term 2, removed along with the rest of Year 3's stale pre-redesign data (see data/terms.yaml)"
  - name: "Master at Arms Activity Badge (Air Rifle / Pistol Shooting)"
    earned: "TBD — pending Year 3 replan; previously Year 3, Term 3, removed along with the rest of Year 3's stale pre-redesign data (see data/terms.yaml)"

staged_activity_badges:
  - name: "Nights Away Staged Activity Badge"
    notes: >-
      Attained automatically by Scouts who choose to attend the optional
      weekend camps (+2 nights per term).
  - name: "Hikes Away Staged Activity Badge"
    notes: >-
      Attained automatically by Scouts who choose to attend the optional
      term night hikes and lightweight expeditions.
  - name: "Time on the Water Staged Activity Badge"
    notes: >-
      Accumulated by Scouts who choose to attend the summer paddleboarding
      sessions.
  - name: "Navigator Staged Activity Badge (Stage 3/4)"
    earned: "TBD — displaced from Year 2, Term 1 when that term became the Creative Challenge Award term; not yet re-slotted (see data/terms.yaml)"
  - name: "Paddle Sports Staged Activity Badge (Stage 1)"
    earned: "Year 2, Term 3"
    notes: >-
      Resolves a TBD flag left in data/terms.yaml (previously mis-recorded
      as a flat "Paddle Sports Activity Badge" displaced from Year 1, Term
      3 — that badge doesn't exist; it's a staged badge, and Stage 1 is
      the natural starting stage with no prior paddle sports experience
      assumed). Distinct from the Time on the Water Staged Activity Badge
      above, which is attendance-based rather than skill-based.
  - name: "Emergency Aid Staged Activity Badge (Stage 3)"
    earned: "Year 1, Term 2"
