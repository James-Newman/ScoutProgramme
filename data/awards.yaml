# Full award catalogue for the 3-year, 9-term programme.
# A Scout who consistently attends and participates in regular weekly
# meetings over the 9-term journey achieves this full set of awards.
#
# PIVOT: the programme moved from a 4-year, 12-term plan to 3-year, 9-term.
# Year 4 badges are dropped entirely, not re-slotted (see data/terms.yaml):
# Survival Skills Activity Badge; Photographer Activity Badge; Campers
# Activity Badge; the Global Issues and Expedition Challenge Award Cycle 2
# refreshers that were tied to Year 4. They're removed from this catalogue
# rather than left as "TBD, not yet re-slotted", since there's no plan to
# bring them back into a 3-year programme. (Note: "Global Issues Challenge
# Award" itself turned out not to exist -- see NAMING CORRECTION below --
# so its Year 4 Cycle 2 refresher was never real either.)
#
# NAMING CORRECTION: "Global Issues Challenge Award" was never a real Scout
# Association badge -- there are only 9 real Challenge Awards for the Scouts
# section (Adventure, World, Creative, Expedition, Outdoor, Personal,
# Skills, Team Leader, Teamwork). It's been removed from challenge_awards
# below. What was actually meant, most likely since the original Google Doc
# import, is the real "Global Issues Activity Badge" -- now correctly named
# and earned in Year 2, Term 3 (see activity_badges below), resolving the
# old displacement from Year 1, Term 2.
#
# RESOLVED (Year 3 pending-replan badges): of the four badges previously
# flagged "TBD — pending Year 3 replan" (see data/terms.yaml), three are
# now resolved: Skills Challenge Award is earned in the newly-replanned
# Year 3, Term 1; Personal Challenge Award and Master at Arms Activity
# Badge (Air Rifle / Pistol Shooting) both moved to passive instead (see
# their entries below). Communicator Activity Badge is still pending.
#
# MOVED TO PASSIVE: Paddle Sports Staged Activity Badge (Stage 1) was Year
# 2, Term 3's dedicated focus badge; it's now passive instead (see
# filler-sessions/paddle-sports-staged-activity-badge.md), because the
# group already runs paddle sports content every summer term regardless of
# any dedicated badge term. Year 2, Term 3 has since been re-slotted with
# Global Issues Activity Badge instead (see NAMING CORRECTION above). Team
# Leader Challenge Award, Personal Challenge Award, Expedition Challenge
# Award, and Master at Arms Activity Badge have also moved to passive --
# see their individual entries below for how each is actually covered.
#
# RESOLVED (Year 3, Terms 2 and 3): now filled with Scientist Activity
# Badge (Term 2) and Environmental Conservation Activity Badge (Term 3) --
# resolving two more long-standing displacement flags. Still displaced/TBD
# after this: Navigator Staged Activity Badge (Stage 3/4), Hiker Activity
# Badge, and Communicator Activity Badge.
#
# MOVED TO PASSIVE: Navigator Staged Activity Badge (Stage 3/4) is now
# passive too -- see filler-sessions/navigator-stage-3.md and
# filler-sessions/navigator-stage-4.md, plus its entry below.
#
# MOVED TO COMPLETE-IN-ONE-SITTING FILLER: Communicator Activity Badge is
# fully completable in a single sitting via Option 3 (Mobile and Internet
# Communication) -- see filler-sessions/communicator-activity-badge.md.
# Unlike the passive badges above (which stay in this catalogue because
# the group's standing terms/hikes/water sessions genuinely guarantee
# coverage), this badge has been REMOVED from the catalogue entirely,
# the same way Writer/Entertainer/Media Relations & Marketing/Air
# Spotter/Local Knowledge/Naturalist/World Faiths already were: it's only
# earned if a leader chooses to slot the filler session into a term that
# happens to have a free week, not guaranteed for every Scout. See
# filler-sessions/README.md.
#
# DROPPED: "Hiker Activity Badge" was never a real Scout Association badge
# either -- like "Global Issues Challenge Award," it's a naming error, most
# likely since the original Google Doc import. There are 79 real Activity
# Badges for the Scouts section; the closest match is "Hill Walker Activity
# Badge," but that's a substantially bigger commitment than what "Hiker"
# implied -- 5 one-day journeys of 14km+ specifically in hilly country,
# 3 of them led by a qualified permit holder, plus knowledge of the BMC's
# "Safety on Mountains" publication. That's genuinely different from (and
# well beyond) the group's regular Night Hikes and Hikes Away Staged
# Activity Badge, which have no minimum distance, no hilly-terrain
# requirement, and no permit holder involved. Rather than force-fit Hill
# Walker in or invent hillwalking logistics the group doesn't have, it's
# dropped from the programme entirely -- removed from activity_badges
# below, not left as "TBD, not yet re-slotted", the same treatment as the
# Year 4 badges above. This was the last remaining displaced/TBD badge in
# the catalogue -- every badge now either has a genuine home or has been
# deliberately dropped.
#
# GOLD AWARD GAP: RESOLVED. Expedition Challenge Award's individual-report
# requirement is now covered -- Scouts who do the hike write it
# independently in their own time within the three-week window, no
# dedicated session needed (see its entry below). With all 9 Challenge
# Awards genuinely covered, the Chief Scout's Gold Award is fully
# achievable as documented.

top_award:
  name: "Chief Scout's Gold Award"
  earned: "Passive — not tied to any specific term"
  notes: >-
    Presented to each Scout individually as they complete all required
    Challenge Awards and personal milestones, whenever that happens to
    fall, rather than at a single end-of-programme ceremony. Previously
    tied to the end of Year 4, Term 3, before Year 4 was dropped. All 9
    Challenge Awards now have a genuine home (earned or passive) with no
    outstanding gaps -- see challenge_awards below.

challenge_awards:
  - name: "World Challenge Award"
    earned:
      - "Year 1, Term 1"
    notes: >-
      All 7 requirements are covered in Year 1, Term 1 (see
      year-1/term-1/) across just 4 of the term's 7 core-content
      sessions — reqs 3+4 (beliefs/attitudes/values) and reqs 6+7
      (international issues/connections) each combine into one
      session, and reqs 2+5 (a volunteering day, an environmental
      project) combine into one non-standard "day" session at an
      environmental-linked local service. The 3 freed sessions carry
      filler-session badges (World Faiths, Local Knowledge,
      Naturalist) instead of new World Challenge Award content.
  - name: "Outdoor Challenge Award"
    earned:
      - "Passive — not tied to any specific term"
    notes: >-
      Never a dedicated focus-badge term. Earned across many terms via
      filler-sessions/outdoor-challenge-award/ (skill-teaching sessions
      slotted in wherever a term has room) plus the standing Camp/Night
      Hike/Welcome/External Activity guidance documented in AGENTS.md.
      See filler-sessions/outdoor-challenge-award/README.md for the
      full requirement map. Nights Away specifically is an explicitly
      cumulative requirement (at least eight nights away, four camping)
      that crosses the threshold around Year 2, Term 1 regardless.
  - name: "Adventure Challenge Award"
    earned:
      - "Passive — not tied to any specific term"
    notes: >-
      Never a dedicated focus-badge term. The "four different adventurous
      activities" requirement accumulates via every term's standing
      External Activity slot; the reflective requirements are delivered
      by filler-sessions/adventure-challenge-award.md whenever a Scout
      has enough External Activities behind them. Previously assigned to
      Year 1, Term 3 ("Pioneering & Outdoor Survival") before that term
      became the Chef Activity Badge term — see the note in
      data/terms.yaml.
  - name: "Team Leader Challenge Award"
    earned:
      - "Passive — assessed termly rather than via a dedicated term"
    notes: >-
      Its four requirements, over at least three months, are: successfully
      lead a Scout team at a camp or all-day event; help a new Scout become
      part of the Troop; help another Scout develop a Scouting skill; and
      represent the views of other Scouts (e.g. at a Patrol Leaders'
      Council) and report back to them. Rather than a dedicated term or a
      filler-sessions file, leaders review each Scout's progress against
      these once per term — the leading-a-team requirement is a natural fit
      for the standing summer Camp, and the others accumulate through
      ordinary patrol life. Previously displaced from Year 2, Term 1 when
      that term became Creative Challenge Award — see data/terms.yaml.
  - name: "Creative Challenge Award"
    earned:
      - "Year 2, Term 1"
    notes: >-
      Moved here from Year 2, Term 2 when Term 1 became the Creative
      Challenge Award term and Term 2 became Pioneer Activity Badge instead
      — see data/terms.yaml.
  - name: "Expedition Challenge Award"
    earned:
      - "Passive — not tied to any specific term"
    notes: >-
      Requires a two-day expedition/exploration with 3+ other Scouts
      including a night away, active participation in planning/training,
      navigating/cooking/completing a task during it, and an individual
      report within three weeks. The core activity is covered by the
      standing summer Camp and/or the autumn Grimsdyke Challenge Hike (an
      additional real event the group uses) — both already involve a night
      away and the right shape of activity. The individual report is
      written independently by each Scout in their own time after the hike,
      within the three-week window — no dedicated session needed. Previously
      displaced from Year 2, Term 3 when that term became Paddle Sports
      Staged Activity Badge (Stage 1); its Cycle 2/senior-roles refresher
      was separately planned for Year 4, Term 3 and dropped along with the
      rest of Year 4 — see data/terms.yaml.
  - name: "Skills Challenge Award"
    earned:
      - "Year 3, Term 1"
  - name: "Teamwork Challenge Award"
    earned:
      - "Passive — not tied to any specific term"
    notes: >-
      Never a dedicated focus-badge term. Three of its four requirements
      accumulate via every term's standing Welcome Session (regular
      patrol activities, a varied icebreaker, and the "agree own rules"
      block counting as a Patrol/Troop Forum); the reflective requirement
      is delivered by filler-sessions/teamwork-challenge-award.md.
  - name: "Personal Challenge Award"
    earned:
      - "Passive — discussed each term rather than via a dedicated term"
    notes: >-
      Requires completing two personal challenges agreed with a leader (one
      chosen by the Scout, one by the leader), different from any done for
      the Beaver/Cub versions. Rather than a dedicated term, this needs a
      standing termly reminder for both Scouts and leaders — agreeing or
      revisiting challenges is easy to let slip without a regular prompt.
      Previously pending Year 3 replan (was Year 3, Term 3 in the removed
      pre-redesign data) — see data/terms.yaml.

activity_badges:
  - name: "Environmental Conservation Activity Badge"
    earned: "Year 3, Term 3"
    notes: >-
      Requires researching an environmental issue important to the local
      community, taking part in an activity or project that improves local
      conservation, and running a campaign to raise awareness of an
      environmental issue. Displaced from Year 1, Term 2 when that term
      became the Emergency Aid term; resolved here.
  - name: "Pioneer Activity Badge"
    earned: "Year 2, Term 2"
    notes: >-
      Displaced from Year 1, Term 3 when that term became the Chef Activity
      Badge term; now resolved in Year 2, Term 2. Its knot-tying/pioneering-
      safety content is the natural home for the Outdoor Challenge Award's
      pioneering-gadget requirement (requirement 7) — see
      filler-sessions/outdoor-challenge-award/README.md.
  - name: "Scientist Activity Badge"
    earned: "Year 3, Term 2"
    notes: >-
      Uses Option 2: three science experiments or activities, each with a
      changed variable, a prediction, and a check against what actually
      happened, plus a real-world link explained to others. Chosen over
      Option 1 (and over the alternative Artist Activity Badge, previously
      considered for this slot) so the whole Troop works on one badge
      together rather than splitting into parallel tracks. Displaced from
      Year 2, Term 2 when that term became the Pioneer Activity Badge term;
      resolved here.
  - name: "Chef Activity Badge"
    earned: "Year 1, Term 3"
  - name: "Global Issues Activity Badge"
    earned: "Year 2, Term 3"
    notes: >-
      Corrects a long-standing naming error: the catalogue previously
      listed this as "Global Issues Challenge Award", which isn't a real
      Scout Association badge — see the NAMING CORRECTION note at the top
      of this file. Resolves the displacement from Year 1, Term 2.
  - name: "Master at Arms Activity Badge (Air Rifle / Pistol Shooting)"
    earned: "Passive — not tied to any specific term"
    notes: >-
      Requires at least six training sessions in a relevant activity
      (fencing, shooting, or archery) showing improved technique, learning
      and following the activity's safety rules, and taking part in an
      officially supervised contest with instructor feedback afterwards
      (holders of the NSRA Youth Proficiency Scheme in Air Rifle/Air Pistol
      earn it automatically). The safety-rules requirement is delivered by
      filler-sessions/master-at-arms-activity-badge.md; the six training
      sessions and the supervised contest are covered passively by the
      standing Shooting Session fixed slot every Autumn term includes (see
      AGENTS.md), a supervised air rifle/pistol range visit that recurs once
      per year across all three years. Previously pending Year 3 replan (was
      Year 3, Term 1 in the removed pre-redesign data) — see data/terms.yaml.
  - name: "Orienteer Activity Badge"
    earned: "Passive — not tied to any specific term"
    notes: >-
      Requires learning about the sport of orienteering, learning map
      colours/symbols, orientating a map and using basic map skills
      (including "thumbing" the map), and completing three different
      orienteering courses. Delivered in full by the standing Little O
      fixed slot every Autumn term includes (see AGENTS.md and
      little-o-orienteering.md) — all four requirements, including the
      three courses, are designed to complete in a single outing rather
      than accumulate across years.

staged_activity_badges:
  - name: "Nights Away Staged Activity Badge"
    notes: >-
      Attained automatically by Scouts who choose to attend the optional
      weekend camps (+2 nights per term).
  - name: "Hikes Away Staged Activity Badge"
    notes: >-
      Attained automatically by Scouts who choose to attend the optional
      term night hikes and lightweight expeditions.
  - name: "Time on the Water Staged Activity Badge"
    notes: >-
      Accumulated by Scouts who choose to attend the summer paddleboarding
      sessions.
  - name: "Navigator Staged Activity Badge (Stage 3/4)"
    earned: "Passive — not tied to any specific term"
    notes: >-
      Never a dedicated focus-badge term. Stage 3's map-reading knowledge
      (grid references, contours, scale, symbols, kit) is delivered by
      filler-sessions/navigator-stage-3.md; Stage 4's bearings and advanced
      map-interpretation knowledge is delivered by
      filler-sessions/navigator-stage-4.md. Both stages' real navigating
      requirements (a 5km navigated route for Stage 3; two independent 5km
      compass routes for Stage 4) need real terrain, which every term's
      standing Night Hike already provides, plus any optional hikes counted
      toward Hikes Away — so they're covered passively whenever a Scout
      takes a genuine navigating turn. Previously displaced from Year 2,
      Term 1 when that term became the Creative Challenge Award term; moved
      to passive rather than re-slotted into a dedicated term, since the
      group already runs the hikes needed regardless — see data/terms.yaml.
  - name: "Paddle Sports Staged Activity Badge (Stage 1)"
    earned: "Passive — not tied to any specific term"
    notes: >-
      Never a dedicated focus-badge term. Three of its five requirements
      (craft types, local venues, dress/buoyancy aid) are delivered by
      filler-sessions/paddle-sports-staged-activity-badge.md; the other two
      (the warm-up activity and the on-water taster session) need real
      water access, which every summer term already provides via the
      standing Time on the Water optional-progression slot/External
      Activity booking — so they're covered passively whenever that
      recurring opportunity happens to be a paddle sports session.
      Previously a dedicated Year 2, Term 3 focus badge; moved to passive
      because the group already runs paddle sports content every summer
      term regardless, so a whole term dedicated to it was redundant — see
      data/terms.yaml. Distinct from the Time on the Water Staged Activity
      Badge above, which is attendance-based rather than skill-based.
  - name: "Emergency Aid Staged Activity Badge (Stage 3)"
    earned: "Year 1, Term 2"
