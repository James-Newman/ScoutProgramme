site_name: Scout Programme
site_description: A 3-year, 9-term programme plan for a UK Scout Troop
site_url: https://james-newman.github.io/ScoutProgramme/
repo_url: https://github.com/James-Newman/ScoutProgramme
repo_name: James-Newman/ScoutProgramme
edit_uri: edit/main/

docs_dir: mkdocs-src
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.path
    - navigation.indexes
    - toc.integrate
    - content.action.edit
    - search.suggest

markdown_extensions:
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Programme overview:
      - Timeline: docs/timeline.md
      - Awards summary: docs/awards-summary.md
      - "Little O (template, Autumn terms)": little-o-orienteering.md
  - Year 1:
      - Term 1 — Community & Global Citizenship:
          - Overview: year-1/term-1/overview.md
          - 1. Welcome Session: year-1/term-1/welcome-session.md
          - 2. Community Research: year-1/term-1/community-research.md
          - 3. Beliefs, Attitudes & Values: year-1/term-1/beliefs-attitudes-and-values.md
          - 4. World Faiths (filler session): filler-sessions/world-faiths.md
          - 5. Night Hike: year-1/term-1/night-hike.md
          - 6. Community & Environmental Action Day: year-1/term-1/community-and-environmental-action-day.md
          - 7. International Issues & Connections: year-1/term-1/international-issues-and-connections.md
          - 8. External Activity: year-1/term-1/external-activity.md
          - 9. Shooting Session: year-1/term-1/shooting-session.md
          - 10. Camp: year-1/term-1/camp.md
          - 11. Little O: year-1/term-1/little-o-orienteering.md
          - 12. End of Term Fun & Games: year-1/term-1/end-of-term-fun-and-games.md
      - Term 2 — First Aid & Emergency Response:
          - Overview: year-1/term-2/overview.md
          - 1. Welcome Session: year-1/term-2/welcome-session.md
          - 2. Getting Help & Unconscious: year-1/term-2/getting-help-and-unconscious.md
          - 3. Bleeding, Burns & Choking: year-1/term-2/bleeding-burns-and-choking.md
          - 4. Communicator (filler session): filler-sessions/communicator-activity-badge.md
          - 5. Tent Pitching (filler session): filler-sessions/outdoor-challenge-award/tent-pitching.md
          - 6. Campsite Selection (filler session): filler-sessions/outdoor-challenge-award/campsite-selection.md
          - 7. Heat, Cold & Breathing: year-1/term-2/heat-cold-and-breathing.md
          - 8. Night Hike: year-1/term-2/night-hike.md
          - 9. Emergency Aid Scenario Practice: year-1/term-2/emergency-aid-scenario-practice.md
          - 10. External Activity: year-1/term-2/external-activity.md
          - 11. Camp: year-1/term-2/camp.md
          - 12. End of Term Fun & Games: year-1/term-2/end-of-term-fun-and-games.md
      - Term 3 — Fire & Cooking (framework only):
          - Overview: year-1/term-3/overview.md
  - Year 2:
      - Term 1 — Creative Challenge (framework only):
          - Overview: year-2/term-1/overview.md
      - Term 2 — Knots & Pioneering (framework only):
          - Overview: year-2/term-2/overview.md
      - Term 3 — Global Issues (framework only):
          - Overview: year-2/term-3/overview.md
  - Year 3:
      - Term 1 — Skills & Self-Reliance (framework only):
          - Overview: year-3/term-1/overview.md
      - Term 2 — Science & Art (framework only):
          - Overview: year-3/term-2/overview.md
      - Term 3 — Environmental Conservation (framework only):
          - Overview: year-3/term-3/overview.md
  - Resources:
      - Index: resources/README.md
      - Kit list bingo cards: resources/kit-list-bingo-cards.md
      - Camp kit scenario cards: resources/camp-kit-scenario-cards.md
      - Hygiene true or false statements: resources/hygiene-true-or-false-statements.md
      - Toilets, rubbish & waste scenario cards: resources/toilets-rubbish-waste-scenario-cards.md
      - Hazard spotting cards: resources/hazard-spotting-cards.md
      - STOP sequencing cards: resources/stop-sequencing-cards.md
      - STOP poster: resources/stop-poster.md
      - Weather cards: resources/weather-cards.md
      - First aid kit checklist: resources/first-aid-kit-checklist.md
      - Site design grid: resources/site-design-grid.md
      - Site inspector scorecard: resources/site-inspector-scorecard.md
      - Menu planning template: resources/menu-planning-template.md
      - Flag cards: resources/flag-cards.md
      - International issue briefing cards: resources/international-issue-briefing-cards.md
      - Contacting Scouts abroad guide: resources/contacting-scouts-abroad-guide.md
  - Filler sessions:
      - Index: filler-sessions/README.md
      - Complete in one sitting:
          - Writer: filler-sessions/writer.md
          - Entertainer: filler-sessions/entertainer.md
          - Media Relations & Marketing: filler-sessions/media-relations-and-marketing.md
          - Air Spotter: filler-sessions/air-spotter.md
          - Local Knowledge: filler-sessions/local-knowledge.md
          - Naturalist: filler-sessions/naturalist.md
          - World Faiths: filler-sessions/world-faiths.md
          - Communicator: filler-sessions/communicator-activity-badge.md
      - Passive progress (accumulated across many terms):
          - Outdoor Challenge Award — Index: filler-sessions/outdoor-challenge-award/README.md
          - Outdoor — Tent Pitching: filler-sessions/outdoor-challenge-award/tent-pitching.md
          - Outdoor — Campsite Selection: filler-sessions/outdoor-challenge-award/campsite-selection.md
          - Outdoor — Site Layout & Design: filler-sessions/outdoor-challenge-award/site-layout-design.md
          - Outdoor — Camp Hygiene & Food Safety: filler-sessions/outdoor-challenge-award/camp-hygiene-and-food-safety.md
          - Outdoor — Outdoor Safety & Risk Awareness: filler-sessions/outdoor-challenge-award/outdoor-safety-and-risk-awareness.md
          - Outdoor — Fire Safety & Camp Cooking Prep: filler-sessions/outdoor-challenge-award/fire-safety-and-camp-cooking.md
          - Outdoor — Camp Kit & Personal Equipment: filler-sessions/outdoor-challenge-award/camp-kit-and-personal-equipment.md
          - Adventure Challenge Award: filler-sessions/adventure-challenge-award.md
          - Teamwork Challenge Award: filler-sessions/teamwork-challenge-award.md
          - Paddle Sports Staged Activity Badge (Stage 1): filler-sessions/paddle-sports-staged-activity-badge.md
          - Master at Arms Activity Badge: filler-sessions/master-at-arms-activity-badge.md
          - Navigator Staged Activity Badge — Stage 3: filler-sessions/navigator-stage-3.md
          - Navigator Staged Activity Badge — Stage 4: filler-sessions/navigator-stage-4.md
